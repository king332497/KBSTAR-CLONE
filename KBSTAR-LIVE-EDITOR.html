<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBSTAR GitHub Live Editor</title>
<style>
:root{--bg:#111318;--panel:#181b22;--line:#2b303b;--text:#f5f7fb;--muted:#a8b0bd;--accent:#ffe000}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0e1014}.brand{display:flex;align-items:center;gap:10px;min-width:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px rgba(255,224,0,.55)}.brand strong{font-size:14px}.brand span{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{border:1px solid var(--line);background:#20242d;color:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}button.primary{background:var(--accent);color:#191919;border-color:var(--accent);font-weight:700}.workspace{min-height:0;display:grid;grid-template-columns:minmax(330px,42%) 1fr}.editor-pane,.preview-pane{min-width:0;min-height:0}.editor-pane{border-right:1px solid var(--line);display:grid;grid-template-rows:38px 1fr;background:var(--panel)}.pane-title{display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:14px;background:#13161c;color:#e8ebf1;font:12px/1.55 Consolas,Monaco,monospace;tab-size:2;white-space:pre}.preview-pane{display:grid;grid-template-rows:38px 1fr;background:#fff}iframe{width:100%;height:100%;border:0;background:#fff}.status{color:#8ad49a}@media(max-width:900px){.app{height:auto;min-height:100vh}.workspace{grid-template-columns:1fr;grid-template-rows:52vh 70vh}.editor-pane{border-right:0;border-bottom:1px solid var(--line)}.topbar{min-height:58px;height:auto;padding:10px 12px;align-items:flex-start}.brand{flex-direction:column;align-items:flex-start;gap:2px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="dot"></div><strong>KBSTAR GitHub Live Editor</strong><span>Terhubung ke index.html repository ini</span></div><div class="actions"><button id="reloadBtn">Muat ulang GitHub</button><button id="downloadBtn">Simpan HTML</button><a class="btn" href="./index.html" target="_blank" rel="noopener">Buka Website</a><button class="primary" id="applyBtn">Terapkan Preview</button></div></header>
<main class="workspace"><section class="editor-pane"><div class="pane-title"><span>KODE index.html</span><span id="status" class="status">Memuat...</span></div><textarea id="editor" spellcheck="false"></textarea></section><section class="preview-pane"><div class="pane-title"><span>PREVIEW WEBSITE</span><span>Perubahan lokal</span></div><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></section></main>
</div>
<script>
const editor=document.getElementById('editor'),preview=document.getElementById('preview'),statusEl=document.getElementById('status');
let original='';
function render(){preview.srcdoc=editor.value;statusEl.textContent='Preview diperbarui';setTimeout(()=>statusEl.textContent='Siap',1000)}
async function loadFromGitHub(){statusEl.textContent='Memuat index.html...';try{const r=await fetch('./index.html?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);original=await r.text();editor.value=original;render();statusEl.textContent='Terhubung ke GitHub';}catch(e){statusEl.textContent='Gagal memuat index.html';editor.value='Gagal memuat ./index.html\n\n'+e.message;}}
document.getElementById('reloadBtn').addEventListener('click',loadFromGitHub);document.getElementById('applyBtn').addEventListener('click',render);document.getElementById('downloadBtn').addEventListener('click',()=>{const blob=new Blob([editor.value],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)});let timer;editor.addEventListener('input',()=>{statusEl.textContent='Mengedit...';clearTimeout(timer);timer=setTimeout(render,700)});editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart,t=editor.selectionEnd;editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(t);editor.selectionStart=editor.selectionEnd=s+2}});loadFromGitHub();
</script>
</body>
</html>
