name: Restore KBSTAR baseline

on:
  push:
    branches:
      - codex/kbstar-full-baseline
    paths:
      - .baseline/part06

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/kbstar-full-baseline

      - name: Reconstruct exact KBSTAR source
        shell: bash
        run: |
          set -euo pipefail
          cat .baseline/part00 .baseline/part01 .baseline/part02 .baseline/part03 .baseline/part04 .baseline/part05 .baseline/part06 > /tmp/kbstar.html.xz.b64
          base64 -d /tmp/kbstar.html.xz.b64 > /tmp/kbstar.html.xz
          xz -dc /tmp/kbstar.html.xz > index.html
          test "$(wc -c < index.html)" -eq 509542
          echo "1e56b5e5abb9bb981624705210744b572a53006aa6de6a2c582fca625ac2dfd0  index.html" | sha256sum -c -

      - name: Commit exact baseline and cleanup staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .baseline
          rm -f .github/workflows/restore-kbstar-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set KBSTAR-FULL as baseline source"
          git push origin HEAD:codex/kbstar-full-baseline
